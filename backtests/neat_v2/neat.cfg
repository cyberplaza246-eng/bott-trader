enabled_default         = True
enabled_mutate_rate     = 0.02
feed_forward            = True
initial_connection      = partial_direct 0.15
node_add_prob           = 0.15
node_delete_prob        = 0.1
num_hidden              = 0
num_inputs              = 34
num_outputs             = 3
response_init_mean      = 1.0
response_init_stdev     = 0.0
