name: Build Desktop App

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_desktop.txt

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name BottTrader ^
            --add-data "src;src" ^
            --add-data "config;config" ^
            --add-data "data;data" ^
            --hidden-import="pandas" ^
            --hidden-import="numpy" ^
            --hidden-import="sklearn" ^
            --hidden-import="sklearn.ensemble" ^
            --hidden-import="sklearn.svm" ^
            --hidden-import="sklearn.preprocessing" ^
            --hidden-import="sklearn.model_selection" ^
            --hidden-import="scipy" ^
            --hidden-import="pandas_ta" ^
            --hidden-import="yfinance" ^
            --hidden-import="requests" ^
            --hidden-import="flask" ^
            --hidden-import="flask_cors" ^
            --hidden-import="feedparser" ^
            --hidden-import="apscheduler" ^
            --hidden-import="apscheduler.schedulers.background" ^
            --hidden-import="async_rithmic" ^
            --hidden-import="dotenv" ^
            --hidden-import="pythonjsonlogger" ^
            --hidden-import="customtkinter" ^
            --hidden-import="pystray" ^
            --hidden-import="plyer.platforms.win.notification" ^
            --collect-all pandas ^
            --collect-all numpy ^
            --collect-all sklearn ^
            --collect-all pandas_ta ^
            --collect-all customtkinter ^
            --collect-all async_rithmic ^
            launcher_app.py
        shell: cmd

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BottTrader-Windows
          path: dist/BottTrader.exe

      - name: Upload exe to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BottTrader.exe
